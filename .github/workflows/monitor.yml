        run: |
          curl \
            -X POST \
            -H "Title: 日本スキー場開発 TDnet" \
            -H "Priority: high" \
            -H "Tags: newspaper" \
            -d "テスト通知です。GitHub Actionsからの通知に成功しました。" \
            https://ntfy.sh/tdnet6040-7kq9m2x8p4
