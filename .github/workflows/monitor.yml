name: TDnet 6040 Monitor

on:
  schedule:
    - cron: "2-59/5 * * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TDnet 6040
        env:
          NTFY_TOPIC: tdnet6040-7kq9m2x8p4
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API_URL = (
              "https://webapi.yanoshin.jp/"
              "webapi/tdnet/list/6040.json2?limit=100"
          )

          STATE_FILE = Path("seen_disclosures.json")
          NTFY_TOPIC = os.environ["NTFY_TOPIC"]

          # -----------------------------
          # 6040の開示を取得
          # -----------------------------
          req = urllib.request.Request(
              API_URL,
              headers={
                  "User-Agent": "tdnet-6040-monitor/1.0"
              }
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          items = data.get("items", [])

          if not items:
              print("6040の開示情報を取得できませんでした。")
              raise SystemExit(1)

          disclosures = []

          for item in items:

              # json2でも通常形式でも対応
              tdnet = item.get("Tdnet", item)

              company_code = str(
                  tdnet.get("company_code", "")
              )

              if company_code != "60400":
                  continue

              disclosures.append({
                  "id": str(tdnet.get("id", "")),
                  "pubdate": tdnet.get("pubdate", ""),
                  "title": tdnet.get("title", ""),
                  "url": tdnet.get("document_url", "")
              })

          if not disclosures:
              print("6040の開示がありません。")
              raise SystemExit(1)

          # 最新順
          disclosures.sort(
              key=lambda x: x["pubdate"],
              reverse=True
          )

          print("6040の最新開示:")

          for item in disclosures[:10]:
              print(
                  item["pubdate"],
                  item["title"]
              )

          # -----------------------------
          # 初回実行
          # -----------------------------
          if not STATE_FILE.exists():

              state = {
                  "seen": [
                      item["id"]
                      for item in disclosures
                  ]
              }

              STATE_FILE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("")
              print(
                  "初回実行：現在の開示を既読として登録しました。"
              )
              print(
                  "過去の開示は通知しません。"
              )

              raise SystemExit(0)

          # -----------------------------
          # 既読データ
          # -----------------------------
          try:
              state = json.loads(
                  STATE_FILE.read_text(
                      encoding="utf-8"
                  )
              )

              seen = set(
                  state.get("seen", [])
              )

          except Exception:
              seen = set()

          # -----------------------------
          # 新着
          # -----------------------------
          new_items = [
              item
              for item in disclosures
              if item["id"] not in seen
          ]

          if not new_items:
              print("新しい6040の開示はありません。")
              raise SystemExit(0)

          print(
              f"新しい6040の開示：{len(new_items)}件"
          )

          # -----------------------------
          # 優待関連キーワード
          # -----------------------------
          priority_keywords = [
              "株主優待",
              "優待",
              "廃止",
              "変更",
              "終了",
              "中止",
              "改悪",
              "縮小",
              "拡充",
              "新設"
          ]

          encoded_topic = urllib.parse.quote(
              NTFY_TOPIC,
              safe=""
          )

          # -----------------------------
          # 通知
          # -----------------------------
          for item in reversed(new_items):

              title = item["title"]

              priority_hit = any(
                  keyword in title
                  for keyword in priority_keywords
              )

              if priority_hit:
                  notify_title = (
                      "🚨 日本スキー場開発（6040）優待関連"
                  )
                  priority = "urgent"
                  tags = "rotating_light,newspaper"

              else:
                  notify_title = (
                      "日本スキー場開発（6040）TDnet"
                  )
                  priority = "default"
                  tags = "newspaper"

              message = (
                  f"{item['pubdate']}\n"
                  f"{title}\n\n"
                  f"{item['url']}"
              )

              notify_req = urllib.request.Request(
                  f"https://ntfy.sh/{encoded_topic}",
                  data=message.encode("utf-8"),
                  method="POST",
                  headers={
                      "Title": notify_title,
                      "Priority": priority,
                      "Tags": tags
                  }
              )

              with urllib.request.urlopen(
                  notify_req,
                  timeout=30
              ) as response:

                  print(
                      "通知送信:",
                      title,
                      response.status
                  )

          # -----------------------------
          # 状態保存
          # -----------------------------
          all_seen = list(seen)

          for item in disclosures:
              if item["id"] not in all_seen:
                  all_seen.append(item["id"])

          # 最大200件
          all_seen = all_seen[-200:]

          STATE_FILE.write_text(
              json.dumps(
                  {"seen": all_seen},
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("監視状態を更新しました。")

          PY

      - name: Save state
        run: |
          if git diff --quiet -- seen_disclosures.json; then
            echo "状態に変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_disclosures.json
          git commit -m "Update TDnet monitoring state"
          git push
